<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- ▼ これがあることで文字化けを防ぎます ▼ -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スロット狙い目ティア管理アプリ</title>
  
  <!-- Tailwind CSS の読み込み -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- JSXをブラウザで実行するためのBabelコンパイラ -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div id="root"></div>
  
  <!-- React やアイコンライブラリを読み込むための設定 -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0"
      }
    }
  </script>
  
  <!-- アプリ本体のコード -->
  <script type="text/babel" data-type="module">
    import React, { useState, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      Search, Star, MessageSquare, Menu, Plus, Move, 
      Check, X, Edit2, Trash2, Layout, History, ListPlus, Image as ImageIcon
    } from 'lucide-react';

    // Rukoさんの公式データ (2026/1/29 最新版)
    const RUKO_OFFICIAL_DATA = [
      { id: 'r_ghoul', name: 'L パチスロ 東京喰種', detail: 'リセット狙い', tier: 'S', tag: 'リセ', tagColor: 'bg-orange-400', imageUrl: 'image_6c1846.jpg' },
      { id: 'r2', name: 'スマスロ北斗の拳', detail: '穢れ・優遇狙い', tier: 'A', tag: '穢れ', tagColor: 'bg-red-500', imageUrl: '' },
      { id: 'r3', name: '甲鉄城のカバネリ', detail: 'スルー回数狙い', tier: 'A', tag: 'スルー', tagColor: 'bg-orange-400', imageUrl: '' },
      { id: 'r4', name: 'L 革命機ヴァルヴレイヴ', detail: '差枚狙い', tier: 'A', tag: '差枚', tagColor: 'bg-yellow-400', imageUrl: '' },
      { id: 'r5', name: 'モンキーターンV', detail: 'スルー狙い', tier: 'B', tag: 'スルー', tagColor: 'bg-orange-400', imageUrl: '' },
      { id: 'r6', name: '炎炎ノ消防隊', detail: '優遇モード狙い', tier: 'B', tag: '優遇', tagColor: 'bg-red-500', imageUrl: '' },
      { id: 'r7', name: '革命機ヴァルヴレイヴ', detail: 'ゾーン狙い', tier: 'B', tag: 'ゾーン', tagColor: 'bg-orange-400', imageUrl: '' },
      { id: 'r8', name: 'ゴッドイー夕ー復活', detail: '差枚狙い', tier: 'B', tag: '差枚', tagColor: 'bg-yellow-400', imageUrl: '' },
      { id: 'r9', name: '賞金首Angel', detail: '区間切断', tier: 'B', tag: '区間切断', tagColor: 'bg-purple-600', imageUrl: '' },
      { id: 'r10', name: 'ToLOVEるダークネス', detail: '優遇狙い', tier: 'B', tag: '優遇', tagColor: 'bg-red-500', imageUrl: '' },
      { id: 'r11', name: 'モンキーターンV', detail: 'ゾーン狙い', tier: 'C', tag: 'ゾーン', tagColor: 'bg-orange-400', imageUrl: '' },
      { id: 'r12', name: '南国育ち', detail: '優遇狙い', tier: 'C', tag: '優遇', tagColor: 'bg-red-500', imageUrl: '' },
      { id: 'r13', name: '炎炎ノ消防隊', detail: 'スルー狙い', tier: 'C', tag: 'スルー', tagColor: 'bg-orange-400', imageUrl: '' },
      { id: 'r14', name: '押忍！番長4', detail: '優遇狙い', tier: 'C', tag: '優遇', tagColor: 'bg-red-500', imageUrl: '' },
      { id: 'r15', name: '沖ドキ！BLACK', detail: 'リセット狙い', tier: 'C', tag: 'リセ', tagColor: 'bg-orange-400', imageUrl: '' },
      { id: 'r16', name: 'モンスターハンターライズ', detail: '稼働低下', tier: '格下げ', tag: '', imageUrl: '' },
      { id: 'r17', name: 'チバリヨ2', detail: 'リスク増', tier: '格下げ', tag: '', imageUrl: '' },
      { id: 'r18', name: 'スマスロ北斗の拳', detail: '格下げ', tier: '格下げ', tag: '', imageUrl: '' },
      { id: 'r19', name: 'シンフォギア 正義の歌', detail: '格下げ', tier: '格下げ', tag: '', imageUrl: '' },
    ];

    const MASTER_TARGET_DATABASE = [
      { id: 'db_ghoul', name: 'L パチスロ 東京喰種', detail: 'リセット 0G〜', category: 'リセット', tag: 'リセ', tagColor: 'bg-orange-400', imageUrl: 'image_6c1846.jpg' },
      { id: 'db1', name: 'スマスロ北斗の拳', detail: '天井狙い 600G〜', category: '天井', tag: '天井', tagColor: 'bg-gray-700', imageUrl: '' },
      { id: 'db3', name: 'モンキーターンV', detail: '1周期目 50pt〜', category: '周期', tag: '周期', tagColor: 'bg-blue-500', imageUrl: '' },
      { id: 'db7', name: 'カバネリ', detail: '美馬後 100G〜', category: '短縮', tag: '短縮', tagColor: 'bg-orange-400', imageUrl: '' },
    ];

    const TIER_CONFIG = [
      { id: 'S', label: 'S', bg: 'bg-gradient-to-r from-red-400 to-red-600' },
      { id: 'A', label: 'A', bg: 'bg-gradient-to-r from-orange-400 to-orange-500' },
      { id: 'B', label: 'B', bg: 'bg-gradient-to-r from-yellow-400 to-yellow-500' },
      { id: 'C', label: 'C', bg: 'bg-gradient-to-r from-green-400 to-green-500' },
      { id: '格下げ', label: '格下げ', bg: 'bg-gradient-to-r from-gray-400 to-gray-600' },
    ];

    const CardImage = ({ url, name, tag, tagColor }) => {
      const [error, setError] = useState(false);
      const [retryIndex, setRetryIndex] = useState(0);

      const variants = useMemo(() => {
        if (!url) return [];
        if (url.startsWith('http') || url.startsWith('data:')) return [url];
        
        const cleanName = url.replace(/^\.\//, '').replace(/^\//, '');
        return [
          cleanName,           
          `./${cleanName}`,    
          `/${cleanName}`      
        ];
      }, [url]);

      const currentUrl = variants[retryIndex];

      const handleError = () => {
        if (retryIndex < variants.length - 1) {
          setRetryIndex(prev => prev + 1);
        } else {
          setError(true);
        }
      };

      return (
        <div className="h-28 relative overflow-hidden bg-neutral-900 flex flex-col justify-end">
          {currentUrl && !error ? (
            <img 
              key={currentUrl} 
              src={currentUrl} 
              alt={name} 
              className="absolute inset-0 w-full h-full object-cover opacity-90 transition-opacity duration-300"
              onError={handleError}
            />
          ) : (
            <div className="absolute inset-0 flex items-center justify-center opacity-20">
              <ImageIcon size={32} className="text-gray-400" />
            </div>
          )}
          <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
          
          <div className="relative z-10 px-2 pb-1">
            <p className="text-[10px] text-white font-black leading-tight drop-shadow-md truncate">{name}</p>
            {tag && (
              <div className={`mt-1 inline-block px-2 py-0.5 rounded text-[9px] font-bold text-black shadow-sm ${tagColor || 'bg-white'}`}>
                {tag}
              </div>
            )}
          </div>
        </div>
      );
    };

    const App = () => {
      const [activeTab, setActiveTab] = useState('ruko'); 
      const [myItems, setMyItems] = useState([
        { id: 'm1', name: 'マイスロ設定メモ', detail: '期待値稼働用', tier: 'S', tag: '設定狙い', tagColor: 'bg-green-400', imageUrl: '' }
      ]);
      const [isEditing, setIsEditing] = useState(false);
      const [draggedItemId, setDraggedItemId] = useState(null);
      const [dragOverTier, setDragOverTier] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [showToast, setShowToast] = useState(null);

      const currentItems = activeTab === 'ruko' ? RUKO_OFFICIAL_DATA : myItems;

      const moveItem = (itemId, targetTier) => {
        setMyItems(prev => prev.map(item => item.id === itemId ? { ...item, tier: targetTier } : item));
        setDraggedItemId(null);
        setDragOverTier(null);
      };

      const handleDragStart = (e, id) => {
        if (activeTab !== 'my') return;
        setDraggedItemId(id);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleDragOver = (e, tierId) => {
        e.preventDefault();
        if (draggedItemId) setDragOverTier(tierId);
      };

      const handleDrop = (e, tierId) => {
        e.preventDefault();
        if (draggedItemId) moveItem(draggedItemId, tierId);
      };

      const addItemFromDB = (dbItem) => {
        const newItem = {
          ...dbItem,
          id: `m-${Date.now()}-${dbItem.id}`,
          tier: 'C'
        };
        setMyItems([...myItems, newItem]);
        triggerToast(`${dbItem.name} をMy Tierに追加しました`);
      };

      const triggerToast = (msg) => {
        setShowToast(msg);
        setTimeout(() => setShowToast(null), 2000);
      };

      const deleteItem = (id) => {
        setMyItems(myItems.filter(item => item.id !== id));
      };

      const filteredItems = currentItems.filter(item => 
        item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
        (item.detail && item.detail.toLowerCase().includes(searchQuery.toLowerCase()))
      );

      const filteredDB = MASTER_TARGET_DATABASE.filter(item => 
        item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
        (item.detail && item.detail.toLowerCase().includes(searchQuery.toLowerCase()))
      );

      return (
        <div className="max-w-md mx-auto min-h-screen bg-gray-100 flex flex-col select-none pb-20 font-sans">
          <header className="sticky top-0 z-50 bg-white border-b shadow-md">
            <div className="px-4 py-2 flex items-center gap-3">
              <div className="w-8 h-8 bg-blue-700 rounded-lg flex items-center justify-center text-white font-black italic text-xs shadow-inner">777</div>
              <div className="flex-1 relative">
                <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4" />
                <input 
                  type="text" 
                  placeholder="機種名で検索..." 
                  className="w-full bg-gray-100 rounded-full py-1.5 pl-9 pr-4 text-sm outline-none focus:ring-2 focus:ring-blue-400/50"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                />
              </div>
              <Menu className="text-gray-500 w-6 h-6" />
            </div>
            
            <div className="bg-neutral-900 text-white px-4 py-3 flex justify-between items-center">
              <div>
                <h1 className="text-[10px] font-bold text-blue-400 uppercase tracking-widest leading-none mb-1">
                  {activeTab === 'ruko' ? "Ruko's Rank" : activeTab === 'my' ? "Personal" : "Target DB"}
                </h1>
                <p className="text-xl font-black italic leading-none flex items-center gap-2">
                  {activeTab === 'ruko' ? "最新(2026/1/29)" : activeTab === 'my' ? "My Tier List" : "狙い目マスター"}
                </p>
              </div>
              {activeTab === 'my' && (
                <button 
                  onClick={() => setIsEditing(!isEditing)}
                  className={`p-2 rounded-full transition-all shadow-lg ${isEditing ? 'bg-red-500 rotate-90' : 'bg-blue-600'}`}
                >
                  {isEditing ? <X size={18} /> : <Edit2 size={18} />}
                </button>
              )}
            </div>
          </header>

          <main className="p-3 flex-1 overflow-y-auto">
            {activeTab === 'list' ? (
              <div className="space-y-2">
                {filteredDB.map((dbItem) => (
                  <div key={dbItem.id} className="bg-white rounded-xl border border-gray-200 p-3 flex items-center gap-3 shadow-sm active:bg-blue-50 transition-colors">
                    <div className="w-16 h-16 bg-neutral-800 rounded-lg overflow-hidden flex-shrink-0 border border-neutral-700">
                      <CardImage url={dbItem.imageUrl} name={dbItem.name} tag={dbItem.tag} tagColor={dbItem.tagColor} />
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 mb-1">
                        <span className="bg-blue-100 text-blue-700 text-[8px] font-black px-1.5 py-0.5 rounded uppercase">{dbItem.category}</span>
                        <h3 className="font-bold text-sm truncate">{dbItem.name}</h3>
                      </div>
                      <p className="text-xs text-gray-500 truncate">{dbItem.detail}</p>
                    </div>
                    <button onClick={() => addItemFromDB(dbItem)} className="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-md active:scale-90">
                      <ListPlus size={20} />
                    </button>
                  </div>
                ))}
              </div>
            ) : (
              <div className="space-y-6">
                {TIER_CONFIG.map((tier) => (
                  <div 
                    key={tier.id} 
                    className={`relative rounded-2xl p-1 transition-all duration-300 ${dragOverTier === tier.id ? 'bg-blue-200/50 scale-[1.02] ring-2 ring-blue-400 ring-dashed' : ''}`}
                    onDragOver={(e) => handleDragOver(e, tier.id)}
                    onDragLeave={() => setDragOverTier(null)}
                    onDrop={(e) => handleDrop(e, tier.id)}
                  >
                    <div className={`w-full h-9 rounded-full mb-3 flex items-center px-6 shadow-lg ${tier.bg} text-white border-b-4 border-black/20`}>
                      <span className="text-2xl font-black italic tracking-tighter drop-shadow-lg">{tier.label}</span>
                    </div>

                    <div className="grid grid-cols-2 gap-3 min-h-[80px]">
                      {filteredItems.filter(i => i.tier === tier.id).map(item => (
                        <div 
                          key={item.id}
                          draggable={activeTab === 'my'}
                          onDragStart={(e) => handleDragStart(e, item.id)}
                          onDragEnd={() => { setDraggedItemId(null); setDragOverTier(null); }}
                          className={`bg-white border-2 border-blue-500 rounded-xl overflow-hidden shadow-md relative transition-all ${activeTab === 'my' ? 'cursor-grab active:cursor-grabbing hover:border-blue-300' : ''} ${draggedItemId === item.id ? 'opacity-20 scale-90' : 'active:scale-95'}`}
                        >
                          <CardImage url={item.imageUrl} name={item.name} tag={item.tag} tagColor={item.tagColor} />
                          
                          <div className="p-2 bg-neutral-900 text-blue-200 text-[10px] leading-tight min-h-[48px] flex items-center border-t border-neutral-800 italic">
                            {item.detail}
                          </div>

                          {activeTab === 'my' && isEditing && (
                            <button 
                              onClick={(e) => { e.stopPropagation(); deleteItem(item.id); }}
                              className="absolute top-1 right-1 bg-red-600 text-white rounded-full p-1.5 shadow-xl z-20 hover:bg-red-700"
                            >
                              <Trash2 size={12} />
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex items-center h-18 z-50 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
            <button onClick={() => { setActiveTab('ruko'); setIsEditing(false); }} className={`flex flex-col items-center flex-1 h-full justify-center transition-all ${activeTab === 'ruko' ? 'text-blue-600 bg-blue-50/30' : 'text-gray-400'}`}>
              <History size={24} className={activeTab === 'ruko' ? 'scale-110 drop-shadow-sm' : ''} />
              <span className="text-[9px] font-black mt-1 uppercase tracking-widest">Ruko</span>
            </button>
            <button onClick={() => { setActiveTab('list'); setIsEditing(false); }} className={`flex flex-col items-center flex-1 h-full justify-center transition-all ${activeTab === 'list' ? 'text-blue-600 bg-blue-50/30' : 'text-gray-400'}`}>
              <Search size={24} className={activeTab === 'list' ? 'scale-110' : ''} />
              <span className="text-[9px] font-black mt-1 uppercase tracking-widest">List</span>
            </button>
            <button onClick={() => setActiveTab('my')} className={`flex flex-col items-center flex-1 h-full justify-center transition-all ${activeTab === 'my' ? 'text-blue-600 bg-blue-50/30' : 'text-gray-400'}`}>
              <Layout size={24} className={activeTab === 'my' ? 'scale-110 drop-shadow-sm' : ''} />
              <span className="text-[9px] font-black mt-1 uppercase tracking-widest">My Tier</span>
            </button>
          </nav>

          {activeTab === 'my' && isEditing && (
            <button 
              onClick={() => {
                const name = prompt('機種名');
                const detail = prompt('狙い目');
                const tag = prompt('タグ (例: リセ, スルー)');
                const img = prompt('画像ファイル名 (例: image_6c1846.jpg)');
                if (name) setMyItems([...myItems, { id: Date.now().toString(), name, detail, tag, tier: 'C', imageUrl: img || '' }]);
              }}
              className="fixed bottom-24 right-6 w-16 h-16 bg-blue-600 text-white rounded-full shadow-2xl flex items-center justify-center active:scale-90 transition-all z-50 border-4 border-white"
            >
              <Plus size={36} />
            </button>
          )}

          {showToast && (
            <div className="fixed top-24 left-1/2 -translate-x-1/2 bg-neutral-900/90 backdrop-blur-md text-white px-6 py-2.5 rounded-full text-xs font-bold shadow-2xl z-[70] animate-bounce flex items-center gap-2 border border-blue-500/50">
              <Check size={14} className="text-blue-400" />
              {showToast}
            </div>
          )}
        </div>
      );
    };

    // Reactアプリの描画を開始
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
