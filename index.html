    const CardImage = ({ url, name, tag, tagColor, hasLink }) => {
      const [error, setError] = useState(false);
      const [retryIndex, setRetryIndex] = useState(0);

      const variants = useMemo(() => {
        if (!url) return [];
        if (url.startsWith('http') || url.startsWith('data:')) return [url];
        
        const cleanName = url.replace(/^\.\//, '').replace(/^\//, '');
        return [
          cleanName,           
          `./${cleanName}`,    
          `/${cleanName}`      
        ];
      }, [url]);

      const currentUrl = variants[retryIndex];

      const handleError = () => {
        if (retryIndex < variants.length - 1) {
          setRetryIndex(prev => prev + 1);
        } else {
          setError(true);
        }
      };

      return (
        <div className="h-28 relative overflow-hidden bg-neutral-900 flex flex-col justify-end">
          {currentUrl && !error ? (
            <img 
              key={currentUrl} 
              src={currentUrl} 
              alt={name} 
              className="absolute inset-0 w-full h-full object-cover opacity-90 transition-opacity duration-300"
              onError={handleError}
            />
          ) : (
            <div className="absolute inset-0 flex items-center justify-center opacity-20">
              <ImageIcon size={32} className="text-gray-400" />
            </div>
          )}

              </div>
            )}
          </div>
        </div>
      );

            setMyItems(updateList(myItems));
          }
          triggerToast(`更新しました`);
        }
        setModalConfig({ isOpen: false, mode: 'add', itemId: null });
      };

      // フォームを閉じる処理
      const handleModalClose = () => {
        setModalConfig({ isOpen: false, mode: 'add', itemId: null });
      };

      const addItemFromDB = (dbItem) => {
        const newItem = {
          ...dbItem,
          id: `m-${Date.now()}-${dbItem.id}`,
          tier: 'C'
        };
        setMyItems([...myItems, newItem]);
        triggerToast(`${dbItem.name} をMy Tierに追加しました`);
      };

      const triggerToast = (msg) => {
        setShowToast(msg);
        setTimeout(() => setShowToast(null), 3000);
      };

      const deleteItem = (id) => {
        if (activeTab === 'ruko' && IS_ADMIN_MODE) {
          setRukoItems(rukoItems.filter(item => item.id !== id));
        } else {
          setMyItems(myItems.filter(item => item.id !== id));
        }
      };

      const filteredItems = currentItems.filter(item => 
        item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
        (item.detail && item.detail.toLowerCase().includes(searchQuery.toLowerCase()))
      );

      const filteredDB = MASTER_TARGET_DATABASE.filter(item => 
        item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
        (item.detail && item.detail.toLowerCase().includes(searchQuery.toLowerCase()))
      );

      // ドラッグ可能かどうかの判定（My Tier は常時可、Ruko's は管理者かつ編集モード時のみ）
      const canDrag = activeTab === 'my' || (activeTab === 'ruko' && IS_ADMIN_MODE && isEditing);

      return (
        <div className="max-w-md mx-auto min-h-screen bg-gray-100 flex flex-col select-none pb-6 font-sans">
          {/* ヘッダー部分 */}
          <header className="sticky top-0 z-50 bg-white shadow-md">
            <div className="bg-neutral-900 text-white px-4 py-3 flex flex-col gap-1">
              <div className="flex justify-between items-start">
                <h1 className="text-[10px] font-bold text-blue-400 uppercase tracking-widest leading-none flex items-center gap-2">
                  {activeTab === 'ruko' ? "Ruko App" : activeTab === 'my' ? "Personal" : "Target DB"}
                  {activeTab === 'ruko' && IS_ADMIN_MODE && <span className="bg-red-500 text-white px-1.5 rounded-sm text-[8px]">Admin Mode</span>}
                </h1>
                
                <div className="flex gap-2">
                  {/* エクスポートボタン (管理者モードのみ表示) */}
                  {activeTab === 'ruko' && IS_ADMIN_MODE && isEditing && (
                    <button 
                      onClick={exportData}
                      className="p-1.5 rounded-full bg-green-600 text-white shadow-lg transition-all active:scale-95 flex items-center justify-center"
                      title="JSONをコピー"
                    >
                      <Download size={14} />
                    </button>
                  )}

                  {/* 編集トグルボタン */}
                  {(activeTab === 'my' || (activeTab === 'ruko' && IS_ADMIN_MODE)) && (
                    <button 
                      onClick={() => setIsEditing(!isEditing)}
                      className={`p-1.5 rounded-full transition-all shadow-lg ${isEditing ? 'bg-red-500 rotate-90' : 'bg-blue-600'}`}
                    >
                      {isEditing ? <X size={14} /> : <Edit2 size={14} />}
                    </button>
                  )}
                </div>
              </div>
              
              <div className="flex justify-between items-end mt-1">
                <p className="text-sm sm:text-base font-black italic leading-tight">
                  {activeTab === 'ruko' ? "最新狙い目Tier表 2026/2/29" : activeTab === 'my' ? "My Tier List" : "狙い目マスター"}
                </p>
                {activeTab === 'ruko' && (
                  <p className="text-[9px] text-gray-400 whitespace-nowrap ml-2 pb-0.5 font-medium">拾いやすさ×期待値の高さ</p>
                )}
              </div>
            </div>
          </header>

          {/* メインコンテンツ部分 */}
          <main className="p-3 flex-1 overflow-y-auto">
            {activeTab === 'list' ? (
              <div className="space-y-2">
                {filteredDB.map((dbItem) => (
                  <div key={dbItem.id} className="bg-white rounded-xl border border-gray-200 p-3 flex items-center gap-3 shadow-sm active:bg-blue-50 transition-colors">
                    <div className="w-16 h-16 bg-neutral-800 rounded-lg overflow-hidden flex-shrink-0 border border-neutral-700">
                      <CardImage url={dbItem.imageUrl} name={dbItem.name} tag={dbItem.tag} tagColor={dbItem.tagColor} hasLink={!!dbItem.link} />
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 mb-1">
                        <span className="bg-blue-100 text-blue-700 text-[8px] font-black px-1.5 py-0.5 rounded uppercase">{dbItem.category}</span>
                        <h3 
                          className={`font-bold text-sm truncate ${dbItem.link ? 'cursor-pointer hover:text-blue-600 transition-colors' : ''}`}
                          onClick={() => dbItem.link && window.open(dbItem.link, '_blank', 'noopener,noreferrer')}
                        >
                          {dbItem.name}
                          {dbItem.link && <ExternalLink size={12} className="inline ml-1 text-gray-400" />}
                        </h3>
                      </div>
                      <p className="text-xs text-gray-500 truncate">{dbItem.detail}</p>
                    </div>
                    <button onClick={() => addItemFromDB(dbItem)} className="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-md active:scale-90">
                      <ListPlus size={20} />
                    </button>
                  </div>
                ))}
              </div>
            ) : (
              <div className="space-y-6">
                {/* --- 追加：現環境についてパネル --- */}
                <div className="bg-white rounded-2xl p-4 shadow-sm border-l-4 border-l-blue-500">
                  <h2 className="text-sm font-black text-gray-800 mb-2 flex items-center gap-2">
                    <MessageSquare size={16} className="text-blue-500" />
                    現環境について
                  </h2>
                  <p className="text-xs text-gray-600 font-medium leading-relaxed whitespace-pre-wrap">
                    年末年始のヴヴヴ２とDUO２のバブルが終わり落ち着いた環境となりすこし厳しい時期に。{"\n"}
                    喰種はいまだに拾えるので軸として、鉄拳や刃牙のスルー狙いも意外と落ちていて履歴読みも簡単なのでしっかり確認する。
                  </p>
                </div>
                {/* ---------------------------------- */}

                {TIER_CONFIG.map((tier) => (
                  <div 
                    key={tier.id} 
                    className={`relative rounded-2xl p-1 transition-all duration-300 ${dragOverTier === tier.id ? 'bg-blue-200/50 scale-[1.02] ring-2 ring-blue-400 ring-dashed' : ''}`}
                    onDragOver={(e) => handleDragOver(e, tier.id)}
                    onDragLeave={() => setDragOverTier(null)}
                    onDrop={(e) => handleDrop(e, tier.id)}
                  >
                    <div className={`w-full h-9 rounded-full mb-3 flex items-center px-6 shadow-lg ${tier.bg} text-white border-b-4 border-black/20`}>
                      <span className="text-2xl font-black italic tracking-tighter drop-shadow-lg">{tier.label}</span>
                    </div>

                    <div className="grid grid-cols-2 gap-3 min-h-[80px]">
                      {filteredItems.filter(i => i.tier === tier.id).map(item => (
                        <div 
                          key={item.id}
                          draggable={canDrag}
                          onDragStart={(e) => handleDragStart(e, item.id)}
                          onDragEnd={() => { setDraggedItemId(null); setDragOverTier(null); }}
                          onClick={() => {
                            if (!isEditing) {
                              setDetailModalConfig({ isOpen: true, item: item });
                              setIsMemoEditing(false);
                              setEditingMemoText(item.memo || '');
                            }
                          }}
                          className={`bg-white border-2 border-blue-500 rounded-xl overflow-hidden shadow-md relative transition-all ${canDrag ? 'cursor-grab active:cursor-grabbing hover:border-blue-300' : ''} ${draggedItemId === item.id ? 'opacity-20 scale-90' : 'active:scale-95'} ${!isEditing ? 'cursor-pointer hover:border-blue-400' : ''}`}
                        >
                          <CardImage url={item.imageUrl} name={item.name} tag={item.tag} tagColor={item.tagColor} hasLink={!!item.link} />
                          
                          <div className="p-2 bg-neutral-900 text-blue-200 text-[10px] leading-tight min-h-[48px] flex items-center border-t border-neutral-800 italic">
                            {item.detail}
                          </div>

                          {/* 編集・削除ボタン */}
                          {(activeTab === 'my' || (activeTab === 'ruko' && IS_ADMIN_MODE)) && isEditing && (
                            <div className="absolute top-1 right-1 flex flex-col gap-1 z-20">
                              <button 
                                onClick={(e) => { e.stopPropagation(); deleteItem(item.id); }}
                                className="bg-red-600 text-white rounded-full p-1.5 shadow-xl hover:bg-red-700"
                              >
                                <Trash2 size={12} />
                              </button>
                              <button 
                                onClick={(e) => { e.stopPropagation(); openEditModal(item.id); }}
                                className="bg-blue-600 text-white rounded-full p-1.5 shadow-xl hover:bg-blue-700"
                              >
                                <Edit2 size={12} />
                              </button>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* 新規追加フローティングボタン */}
          {(activeTab === 'my' || (activeTab === 'ruko' && IS_ADMIN_MODE)) && isEditing && (
            <button 
              onClick={openAddModal}
              className="fixed bottom-6 right-6 w-16 h-16 bg-blue-600 text-white rounded-full shadow-2xl flex items-center justify-center active:scale-90 transition-all z-50 border-4 border-white"
            >
              <Plus size={36} />
            </button>
          )}

          {/* 入力フォーム (モーダル) */}
          {modalConfig.isOpen && (
            <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl animate-in fade-in zoom-in-95 duration-200 flex flex-col max-h-[90vh]">
                <h2 className="text-xl font-black mb-4 text-gray-800 flex-none">
                  {modalConfig.mode === 'add' ? '新規追加' : '編集'}
                </h2>
                
                <div className="space-y-3 flex-1 overflow-y-auto pr-1">
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">機種名 (必須)</label>
                    <input 
                      type="text" 
                      value={formData.name}
                      onChange={(e) => setFormData({...formData, name: e.target.value})}
                      className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="例: スマスロ北斗の拳"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">狙い目</label>
                    <input 
                      type="text" 
                      value={formData.detail}
                      onChange={(e) => setFormData({...formData, detail: e.target.value})}
                      className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="例: 天井狙い 600G〜"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">タグ</label>
                    <input 
                      type="text" 
                      value={formData.tag}
                      onChange={(e) => setFormData({...formData, tag: e.target.value})}
                      className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="例: リセ, スルー"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">画像ファイル名</label>
                    <input 
                      type="text" 
                      value={formData.imageUrl}
                      onChange={(e) => setFormData({...formData, imageUrl: e.target.value})}
                      className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="例: image_6c1846.jpg"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">リンクURL</label>
                    <input 
                      type="text" 
                      value={formData.link}
                      onChange={(e) => setFormData({...formData, link: e.target.value})}
                      className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="例: https://note.com/..."
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">詳細メモ (タップ時に表示)</label>
                    <textarea 
                      value={formData.memo}
                      onChange={(e) => setFormData({...formData, memo: e.target.value})}
                      className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 min-h-[120px]"
                      placeholder="例: 105%ライン: 0スルー130G～&#13;&#10;ただし他のパラメータで変わる"
                    />
                  </div>
                </div>

                <div className="flex gap-3 mt-5 flex-none">
                  <button 
                    onClick={handleModalClose}
                    className="flex-1 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl active:bg-gray-300 transition-colors"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={handleModalSave}
                    className="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl shadow-md active:bg-blue-700 transition-colors"
                  >
                    保存する
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* --- 追加：詳細確認モーダル --- */}
          {detailModalConfig.isOpen && detailModalConfig.item && (
            <div className="fixed inset-0 bg-black/60 z-[110] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setDetailModalConfig({isOpen: false, item: null})}>
              <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl animate-in fade-in zoom-in-95 duration-200 flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-start mb-4 flex-none">
                  <h2 className="text-xl font-black text-gray-800 leading-tight pr-4">{detailModalConfig.item.name}</h2>
                  <button onClick={() => setDetailModalConfig({isOpen: false, item: null})} className="p-1.5 bg-gray-100 rounded-full text-gray-500 active:bg-gray-200 transition-colors">
                    <X size={20} />
                  </button>
                </div>
                
                <div className="mb-4 flex-none">
                  <div className={`inline-block px-3 py-1 rounded text-xs font-bold shadow-sm ${detailModalConfig.item.tagColor || 'bg-gray-200 text-black'}`}>
                    {detailModalConfig.item.detail || '狙い目未設定'}
                  </div>
                </div>

                <div className="relative mb-6 flex-1 overflow-hidden flex flex-col min-h-[150px] group">
                  {isMemoEditing ? (
                    <div className="flex flex-col gap-2 h-full animate-in fade-in zoom-in-95 duration-200">
                      <textarea
                        value={editingMemoText}
                        onChange={(e) => setEditingMemoText(e.target.value)}
                        className="w-full bg-white border-2 border-blue-400 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500 flex-1 overflow-y-auto shadow-inner resize-none"
                        placeholder="メモを入力してください..."
                        autoFocus
                      />
                      <div className="flex gap-2 justify-end flex-none">
                        <button 
                          onClick={() => setIsMemoEditing(false)}
                          className="px-4 py-2 bg-gray-200 text-gray-700 text-xs font-bold rounded-lg active:bg-gray-300 transition-colors"
                        >
                          キャンセル
                        </button>
                        <button 
                          onClick={() => {
                            const updatedItem = { ...detailModalConfig.item, memo: editingMemoText };
                            const updateList = (list) => list.map(i => i.id === updatedItem.id ? updatedItem : i);
                            
                            if (activeTab === 'ruko') {
                              setRukoItems(updateList(rukoItems));
                            } else {
                              setMyItems(updateList(myItems));
                            }
                            
                            setDetailModalConfig({ isOpen: true, item: updatedItem });
                            setIsMemoEditing(false);
                            triggerToast('メモを保存しました');
                          }}
                          className="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg shadow-md active:bg-blue-700 transition-colors"
                        >
                          保存
                        </button>
                      </div>
                    </div>
                  ) : (
                    <>
                      <div 
                        className="bg-gray-50 rounded-xl p-4 border border-gray-200 h-full cursor-pointer hover:bg-blue-50 transition-colors overflow-y-auto"
                        onClick={() => setIsMemoEditing(true)}
                      >
                        <p className="text-sm text-gray-700 whitespace-pre-wrap font-medium leading-relaxed pr-6">
                          {detailModalConfig.item.memo || <span className="text-gray-400">詳細な狙い目メモはまだ登録されていません。<br/>ここをタップしてメモを追加・編集できます。</span>}
                        </p>
                      </div>
                      <div className="absolute top-3 right-3 p-1.5 bg-white shadow-sm border border-gray-100 rounded-full text-gray-400 group-hover:text-blue-500 group-hover:border-blue-200 transition-colors pointer-events-none">
                        <Edit2 size={14} />
                      </div>
                    </>
                  )}
                </div>

                <div className="flex flex-col gap-3 flex-none">
                  {detailModalConfig.item.link && (
                    <button 
                      onClick={() => window.open(detailModalConfig.item.link, '_blank', 'noopener,noreferrer')}
                      className="w-full flex items-center justify-center gap-2 bg-blue-50 text-blue-600 font-bold py-3.5 rounded-xl border border-blue-200 active:bg-blue-100 transition-colors shadow-sm"
                    >
                      <ExternalLink size={18} />
                      詳しい解説記事を見る
                    </button>
                  )}
                  <button 
                    onClick={() => setDetailModalConfig({isOpen: false, item: null})}
                    className="w-full bg-neutral-800 text-white font-bold py-3.5 rounded-xl shadow-md active:bg-neutral-900 transition-colors"
                  >
                    閉じる
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* トースト通知 */}
          {showToast && (
            <div className="fixed top-24 left-1/2 -translate-x-1/2 bg-neutral-900/90 backdrop-blur-md text-white px-6 py-2.5 rounded-full text-xs font-bold shadow-2xl z-[70] animate-bounce flex flex-col items-center text-center gap-1 border border-blue-500/50 w-10/12 max-w-xs">
              <Check size={18} className="text-blue-400" />
              <span>{showToast}</span>
            </div>
          )}
        </div>
      );
    };

    // Reactアプリの描画を開始
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
