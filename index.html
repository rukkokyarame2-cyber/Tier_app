<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta http-equiv="refresh" content="8; url=https://rukkokyarame2-cyber.github.io/Rukos_app/">
  <link rel="canonical" href="https://rukkokyarame2-cyber.github.io/Rukos_app/">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <title>RUKO APPへ移行しました</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --panel: #151515;
      --panel-soft: #202020;
      --text: #f8fafc;
      --muted: #a1a1aa;
      --line: rgba(255, 255, 255, 0.12);
      --accent: #facc15;
      --blue: #60a5fa;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: max(22px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom));
    }

    main {
      width: min(100%, 520px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, var(--panel), #0d0d0d);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      padding: 26px 22px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(250, 204, 21, 0.38);
      border-radius: 999px;
      background: rgba(250, 204, 21, 0.12);
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 7px 10px;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(27px, 8vw, 42px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .notice {
      margin-top: 18px;
      border-radius: 12px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      padding: 14px;
      color: #e5e7eb;
      font-size: 14px;
      line-height: 1.65;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 22px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .button {
      display: flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .button-primary {
      background: var(--accent);
      color: #111827;
    }

    .button-secondary {
      border: 1px solid rgba(96, 165, 250, 0.45);
      background: rgba(96, 165, 250, 0.14);
      color: #bfdbfe;
    }

    .countdown {
      margin-top: 18px;
      color: #d4d4d8;
      font-size: 13px;
      text-align: center;
    }

    .url {
      display: block;
      margin-top: 5px;
      overflow-wrap: anywhere;
      color: #93c5fd;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">RUKO APP</div>
    <h1>最新版へ移行しました</h1>
    <p>
      旧Tier表アプリは、新しいRUKO APPに移行しました。
      ブックマークやホーム画面のショートカットは、最新版のURLへ変更してください。
    </p>

    <div class="notice">
      最新版では、Tier表・狙い目一覧・仕事量管理・攻略思考集をまとめて使えるようにしています。
      使い方は紹介記事にもまとめています。
    </div>

    <div class="actions">
      <a class="button button-primary" href="https://rukkokyarame2-cyber.github.io/Rukos_app/">
        最新版アプリを開く
      </a>
      <a class="button button-secondary" href="https://note.com/ruko7613/n/ndc65b3b217e8">
        紹介記事を見る
      </a>
    </div>

    <div class="countdown">
      <span id="count">8</span>秒後に最新版アプリへ移動します
      <span class="url">https://rukkokyarame2-cyber.github.io/Rukos_app/</span>
    </div>
  </main>

  <script>
    const appUrl = "https://rukkokyarame2-cyber.github.io/Rukos_app/";
    const countEl = document.getElementById("count");
    let count = 8;

    const timer = setInterval(() => {
      count -= 1;
      countEl.textContent = String(Math.max(count, 0));
      if (count <= 0) {
        clearInterval(timer);
        window.location.replace(appUrl);
      }
    }, 1000);
  </script>
</body>
</html>
